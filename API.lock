theorem Inkproof.Scene.frame_param : ∀ (a f : Inkproof.Scene.Pt) (h t : Rat), 0 < h → 0 < f.x * f.x + f.y * f.y → 0 ≤ t → t ≤ 1 → ∀ (p : Inkproof.Scene.Pt), Inkproof.Scene.Region.disc { x := a.x + t * f.x, y := a.y + t * f.y } h p → ∃ u v, 0 ≤ u ∧ u ≤ 1 ∧ 0 ≤ v ∧ v ≤ 1 ∧ p.x = (a.frame f h).fst.x + u * (a.frame f h).snd.fst.x + v * (a.frame f h).snd.snd.x ∧ p.y = (a.frame f h).fst.y + u * (a.frame f h).snd.fst.y + v * (a.frame f h).snd.snd.y
