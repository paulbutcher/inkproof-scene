def Inkproof.Scene.joinRun : Inkproof.Scene.Join → List Inkproof.Scene.Pt → List Inkproof.Scene.Pt
theorem Inkproof.Scene.joinRun_spline_pair : ∀ (k : Nat) (a b : Inkproof.Scene.Pt), Inkproof.Scene.joinRun (Inkproof.Scene.Join.spline k) [a, b] = List.map (fun j => Inkproof.Scene.hermitePoint a b { x := (b.x - a.x) / 2, y := (b.y - a.y) / 2 } { x := (b.x - a.x) / 2, y := (b.y - a.y) / 2 } (↑j / ↑(Max.max k 1))) (List.range (Max.max k 1)) ++ [b]
theorem Inkproof.Scene.joinRun_stepAfter : ∀ (a b : Inkproof.Scene.Pt) (rest : List Inkproof.Scene.Pt), Inkproof.Scene.joinRun Inkproof.Scene.Join.stepAfter (a :: b :: rest) = a :: { x := b.x, y := a.y } :: Inkproof.Scene.joinRun Inkproof.Scene.Join.stepAfter (b :: rest)
theorem Inkproof.Scene.joinRun_stepBefore : ∀ (a b : Inkproof.Scene.Pt) (rest : List Inkproof.Scene.Pt), Inkproof.Scene.joinRun Inkproof.Scene.Join.stepBefore (a :: b :: rest) = a :: { x := a.x, y := b.y } :: Inkproof.Scene.joinRun Inkproof.Scene.Join.stepBefore (b :: rest)
theorem Inkproof.Scene.joinRun_straight : ∀ (r : List Inkproof.Scene.Pt), Inkproof.Scene.joinRun Inkproof.Scene.Join.straight r = r
