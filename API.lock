theorem Inkproof.Scene.lengthBound_pos : ∀ (f : Inkproof.Scene.Pt), 0 < f.x * f.x + f.y * f.y → 0 < Inkproof.Scene.lengthBound f
theorem Inkproof.Scene.lengthBound_sq_le : ∀ (f : Inkproof.Scene.Pt), Inkproof.Scene.lengthBound f * Inkproof.Scene.lengthBound f ≤ f.x * f.x + f.y * f.y
theorem Inkproof.Scene.length_joinRuns : ∀ (j : Inkproof.Scene.Join) (rs : List (List Inkproof.Scene.Pt)), (Inkproof.Scene.joinRuns j rs).length = rs.length
def Inkproof.Scene.lerpChannel : UInt8 → UInt8 → Rat → UInt8
theorem Inkproof.Scene.lerpChannel_mono : ∀ (a b : UInt8), a ≤ b → ∀ {w v : Rat}, 0 ≤ w → w ≤ v → v ≤ 1 → (Inkproof.Scene.lerpChannel a b w).toNat ≤ (Inkproof.Scene.lerpChannel a b v).toNat
theorem Inkproof.Scene.lerpChannel_one : ∀ (a b : UInt8), Inkproof.Scene.lerpChannel a b 1 = b
theorem Inkproof.Scene.lerpChannel_toNat : ∀ (a b : UInt8) {w : Rat}, 0 ≤ w → w ≤ 1 → (Inkproof.Scene.lerpChannel a b w).toNat = (↑a.toNat + (↑b.toNat - ↑a.toNat) * w + 1 / 2).floor.toNat
theorem Inkproof.Scene.lerpChannel_zero : ∀ (a b : UInt8), Inkproof.Scene.lerpChannel a b 0 = a
theorem Inkproof.Scene.lerp_mem_seg : ∀ (a b : Inkproof.Scene.Pt) {t : Rat}, 0 ≤ t → t ≤ 1 → Inkproof.Scene.Region.seg a b (a.lerp b t)
theorem Inkproof.Scene.list_rev_induction : ∀ {α : Type} {P : List α → Prop}, P [] → (∀ (l : List α) (x : α), P l → P (l ++ [x])) → ∀ (l : List α), P l
def Inkproof.Scene.measure : Inkproof.Scene.Pt → Inkproof.Core.First Inkproof.Scene.Pt × Inkproof.Core.Last Inkproof.Scene.Pt × Inkproof.Core.Minimum Rat × Inkproof.Core.Maximum Rat
theorem Inkproof.Scene.mem_compileBars : ∀ {α : Type u} {β : Type v} [inst : LE α] (st : Inkproof.Scene.BarStyle) (baseline : β) (proj : Inkproof.Scene.Projection α β) (s : Inkproof.Core.Series α β) (c : Inkproof.Scene.Command), c ∈ Inkproof.Scene.compileBars st baseline proj s ↔ ∃ x y, (x, Option.some y) ∈ s.points ∧ c = { layer := st.paint.layer, color := st.paint.color, shape := Inkproof.Scene.Shape.rect { x0 := proj.x x - st.width / 2, y0 := proj.y baseline, x1 := proj.x x + st.width / 2, y1 := proj.y y } }
theorem Inkproof.Scene.mem_compileEnvelope_columns : ∀ {β : Type v} (paint : Inkproof.Scene.Paint) (proj : Inkproof.Scene.Projection Nat β) (cols : Array (Option (β × β))) (c : Inkproof.Scene.Column), (∃ cmd, cmd ∈ Inkproof.Scene.compileEnvelope paint proj cols ∧ ∃ items, cmd.shape = Inkproof.Scene.Shape.envelope items ∧ Inkproof.Scene.Item.val c ∈ items) ↔ ∃ i lo hi, cols[i]? = Option.some (Option.some (lo, hi)) ∧ c = { x := proj.x i, lo := proj.y lo, hi := proj.y hi }
theorem Inkproof.Scene.mem_compileHeatmap : ∀ {α : Type u} {β : Type v} {γ : Type} (layer : Nat) (colorOf : γ → Inkproof.Scene.Color) (proj : Inkproof.Scene.Projection α β) (cells : Array (Inkproof.Scene.Cell α β γ)) (c : Inkproof.Scene.Command), c ∈ Inkproof.Scene.compileHeatmap layer colorOf proj cells ↔ ∃ cell, cell ∈ cells ∧ ∃ v, cell.value = Option.some v ∧ c = { layer := layer, color := Inkproof.Scene.Shading.flat (colorOf v), shape := Inkproof.Scene.Shape.rect { x0 := proj.x cell.x0, y0 := proj.y cell.y0, x1 := proj.x cell.x1, y1 := proj.y cell.y1 } }
theorem Inkproof.Scene.mem_compileIsolated : ∀ {α : Type u} {β : Type v} [inst : LE α] (st : Inkproof.Scene.ScatterStyle) (proj : Inkproof.Scene.Projection α β) (g : Inkproof.Core.Segmented α β) (c : Inkproof.Scene.Command), c ∈ Inkproof.Scene.compileIsolated st proj g ↔ ∃ p, [p] ∈ proj.runs g ∧ c = { layer := st.paint.layer, color := st.paint.color, shape := Inkproof.Scene.Shape.marker st.shape p st.radius }
theorem Inkproof.Scene.mem_compileScatter : ∀ {α : Type u} {β : Type v} [inst : LE α] (st : Inkproof.Scene.ScatterStyle) (proj : Inkproof.Scene.Projection α β) (s : Inkproof.Core.Series α β) (c : Inkproof.Scene.Command), c ∈ Inkproof.Scene.compileScatter st proj s ↔ ∃ x y, (x, Option.some y) ∈ s.points ∧ c = { layer := st.paint.layer, color := st.paint.color, shape := Inkproof.Scene.Shape.marker st.shape { x := proj.x x, y := proj.y y } st.radius }
theorem Inkproof.Scene.mem_compileScatterBy : ∀ {α : Type u} {β : Type v} [inst : LE α] (st : Inkproof.Scene.ScatterStyle) (radius : β → Rat) (proj : Inkproof.Scene.Projection α β) (s : Inkproof.Core.Series α β) (c : Inkproof.Scene.Command), c ∈ Inkproof.Scene.compileScatterBy st radius proj s ↔ ∃ x y, (x, Option.some y) ∈ s.points ∧ c = { layer := st.paint.layer, color := st.paint.color, shape := Inkproof.Scene.Shape.marker st.shape { x := proj.x x, y := proj.y y } (radius y) }
theorem Inkproof.Scene.mem_envelopeColumns : ∀ {β : Type v} (proj : Inkproof.Scene.Projection Nat β) (cols : Array (Option (β × β))) (c : Inkproof.Scene.Column), Option.some c ∈ Inkproof.Scene.envelopeColumns proj cols ↔ ∃ i lo hi, cols[i]? = Option.some (Option.some (lo, hi)) ∧ c = { x := proj.x i, lo := proj.y lo, hi := proj.y hi }
theorem Inkproof.Scene.mem_envelopeItems : ∀ (f : Bool) (l : List (Option Inkproof.Scene.Column)) (c : Inkproof.Scene.Column), Inkproof.Scene.Item.val c ∈ Inkproof.Scene.envelopeItems f l ↔ Option.some c ∈ l
theorem Inkproof.Scene.mem_joinRun : ∀ (j : Inkproof.Scene.Join) (r : List Inkproof.Scene.Pt) {q : Inkproof.Scene.Pt}, q ∈ r → q ∈ Inkproof.Scene.joinRun j r
theorem Inkproof.Scene.mul_self_nonneg' : ∀ (r : Rat), 0 ≤ r * r
def Inkproof.Scene.paintOver : (Inkproof.Scene.Command → Bool) → Inkproof.Scene.Pixel → Inkproof.Scene.Color → List Inkproof.Scene.Command → Inkproof.Scene.Color
theorem Inkproof.Scene.paintOver_eq : ∀ (cov : Inkproof.Scene.Command → Bool) (px : Inkproof.Scene.Pixel) (bg : Inkproof.Scene.Color) (cmds : List Inkproof.Scene.Command), Inkproof.Scene.paintOver cov px bg cmds = match (List.filter cov cmds).getLast? with | Option.some c => c.colorAt px | Option.none => bg
theorem Inkproof.Scene.parallelogram_sub_tris : ∀ (a e f : Inkproof.Scene.Pt) (u v : Rat), 0 ≤ u → u ≤ 1 → 0 ≤ v → v ≤ 1 → have p := { x := a.x + u * e.x + v * f.x, y := a.y + u * e.y + v * f.y }; { a := a, b := { x := a.x + e.x, y := a.y + e.y }, c := { x := a.x + f.x, y := a.y + f.y } }.region p ∨ { a := { x := a.x + e.x + f.x, y := a.y + e.y + f.y }, b := { x := a.x + f.x, y := a.y + f.y }, c := { x := a.x + e.x, y := a.y + e.y } }.region p
def Inkproof.Scene.pixelColor : Inkproof.Scene.DisplayList → Inkproof.Scene.Color → Inkproof.Scene.Pixel → Inkproof.Scene.Color
theorem Inkproof.Scene.pixelColor_covered : ∀ {dl : Inkproof.Scene.DisplayList} {bg : Inkproof.Scene.Color} {px : Inkproof.Scene.Pixel} {c : Inkproof.Scene.Command}, c ∈ dl → c.Covers px → ∃ c', c' ∈ dl ∧ c'.Covers px ∧ Inkproof.Scene.pixelColor dl bg px = c'.colorAt px ∧ c.layer ≤ c'.layer
theorem Inkproof.Scene.pixelColor_eq_paintOver : ∀ (dl : Inkproof.Scene.DisplayList) (bg : Inkproof.Scene.Color) (px : Inkproof.Scene.Pixel), Inkproof.Scene.pixelColor dl bg px = Inkproof.Scene.paintOver (fun c => c.shape.meetsB px.window) px bg dl.paintOrder
theorem Inkproof.Scene.pixelColor_of_covers : ∀ {dl : Inkproof.Scene.DisplayList} {bg : Inkproof.Scene.Color} {px : Inkproof.Scene.Pixel}, dl.Covers px → ∃ l1 c l2, dl.toList = l1 ++ c :: l2 ∧ c.Covers px ∧ Inkproof.Scene.pixelColor dl bg px = c.colorAt px ∧ (∀ (c' : Inkproof.Scene.Command), c' ∈ l1 → c'.Covers px → c'.layer ≤ c.layer) ∧ ∀ (c' : Inkproof.Scene.Command), c' ∈ l2 → c'.Covers px → c'.layer < c.layer
theorem Inkproof.Scene.pixelColor_of_not_covers : ∀ {dl : Inkproof.Scene.DisplayList} {bg : Inkproof.Scene.Color} {px : Inkproof.Scene.Pixel}, ¬dl.Covers px → Inkproof.Scene.pixelColor dl bg px = bg
def Inkproof.Scene.placeAxisTitle : Inkproof.Scene.Side → Inkproof.Scene.Rect → Rat → Rat → String → Inkproof.Scene.PlacedLabel
theorem Inkproof.Scene.placeAxisTitle_across : ∀ (side : Inkproof.Scene.Side) (r : Inkproof.Scene.Rect) (extent gap : Rat) (text : String), side.outward * (side.across (Inkproof.Scene.placeAxisTitle side r extent gap text).anchor - side.edge r) = extent + gap
theorem Inkproof.Scene.placeAxisTitle_along : ∀ (side : Inkproof.Scene.Side) (r : Inkproof.Scene.Rect) (extent gap : Rat) (text : String), side.along (Inkproof.Scene.placeAxisTitle side r extent gap text).anchor = ((if side.horizontal = Bool.true then r.x0 else r.y0) + if side.horizontal = Bool.true then r.x1 else r.y1) / 2
theorem Inkproof.Scene.placeAxisTitle_outside : ∀ (side : Inkproof.Scene.Side) (r : Inkproof.Scene.Rect) {extent gap : Rat}, 0 ≤ extent → 0 < gap → ∀ (text : String), 0 < side.outward * (side.across (Inkproof.Scene.placeAxisTitle side r extent gap text).anchor - side.edge r) ∧ extent < side.outward * (side.across (Inkproof.Scene.placeAxisTitle side r extent gap text).anchor - side.edge r)
def Inkproof.Scene.poly : List Inkproof.Scene.Pt → Inkproof.Scene.Region
theorem Inkproof.Scene.poly_append : ∀ {A B : List Inkproof.Scene.Pt} {a b : Inkproof.Scene.Pt}, A.getLast? = Option.some a → B.head? = Option.some b → ∀ (p : Inkproof.Scene.Pt), Inkproof.Scene.poly (A ++ B) p ↔ Inkproof.Scene.poly A p ∨ Inkproof.Scene.Region.seg a b p ∨ Inkproof.Scene.poly B p
theorem Inkproof.Scene.poly_cons_cons : ∀ (a b : Inkproof.Scene.Pt) (l : List Inkproof.Scene.Pt) (p : Inkproof.Scene.Pt), Inkproof.Scene.poly (a :: b :: l) p ↔ p = a ∨ Inkproof.Scene.Region.seg a b p ∨ Inkproof.Scene.poly (b :: l) p
theorem Inkproof.Scene.poly_exists_y : ∀ {l : List Inkproof.Scene.Pt} {u v : Inkproof.Scene.Pt}, u ∈ l → v ∈ l → ∀ {y : Rat}, Inkproof.Scene.Between u.y v.y y → ∃ q, Inkproof.Scene.poly l q ∧ q.y = y
theorem Inkproof.Scene.poly_mem : ∀ {l : List Inkproof.Scene.Pt} {q : Inkproof.Scene.Pt}, Inkproof.Scene.poly l q → ∃ a, a ∈ l ∧ ∃ b, b ∈ l ∧ Inkproof.Scene.Region.seg a b q
theorem Inkproof.Scene.poly_mem_adj : ∀ {l : List Inkproof.Scene.Pt} {q : Inkproof.Scene.Pt}, Inkproof.Scene.poly l q → q ∈ l ∨ ∃ a b, [a, b] <:+: l ∧ Inkproof.Scene.Region.seg a b q
theorem Inkproof.Scene.poly_nil : ∀ (p : Inkproof.Scene.Pt), ¬Inkproof.Scene.poly [] p
theorem Inkproof.Scene.poly_single : ∀ (a p : Inkproof.Scene.Pt), Inkproof.Scene.poly [a] p ↔ p = a
theorem Inkproof.Scene.quad_min : ∀ {D k E t0 t : Rat}, 0 < D → t0 * D = -k → 0 ≤ t → t ≤ 1 → D * Inkproof.Float.clamp 0 1 t0 * Inkproof.Float.clamp 0 1 t0 + 2 * Inkproof.Float.clamp 0 1 t0 * k + E ≤ D * t * t + 2 * t * k + E
def Inkproof.Scene.reducePoints : List Inkproof.Scene.Pt → List Inkproof.Scene.Pt
theorem Inkproof.Scene.reducePoints_covers : ∀ (l : List Inkproof.Scene.Pt) (px : Inkproof.Scene.Pixel), (Inkproof.Scene.poly (Inkproof.Scene.reducePoints l)).Covers px ↔ (Inkproof.Scene.poly l).Covers px
def Inkproof.Scene.reduceRun : List Inkproof.Scene.Pt → List Inkproof.Scene.Pt
theorem Inkproof.Scene.reduceRun_spec : ∀ {G : List Inkproof.Scene.Pt}, G ≠ [] → ∃ f l lo hi, G.head? = Option.some f ∧ G.getLast? = Option.some l ∧ Inkproof.Scene.reduceRun G = [f, { x := f.x, y := lo }, { x := f.x, y := hi }, l] ∧ (∃ p, p ∈ G ∧ p.y = lo) ∧ (∀ (p : Inkproof.Scene.Pt), p ∈ G → lo ≤ p.y) ∧ (∃ p, p ∈ G ∧ p.y = hi) ∧ ∀ (p : Inkproof.Scene.Pt), p ∈ G → p.y ≤ hi
def Inkproof.Scene.render : Inkproof.Scene.DisplayList → Inkproof.Scene.Grid → Inkproof.Scene.Color → Inkproof.Scene.Image
theorem Inkproof.Scene.render_get? : ∀ (dl : Inkproof.Scene.DisplayList) (g : Inkproof.Scene.Grid) (bg : Inkproof.Scene.Color) {px : Inkproof.Scene.Pixel}, g.Has px → (Inkproof.Scene.render dl g bg).get? px.col px.row = Option.some (Inkproof.Scene.pixelColor dl bg px)
theorem Inkproof.Scene.render_get?_out : ∀ (dl : Inkproof.Scene.DisplayList) (g : Inkproof.Scene.Grid) (bg : Inkproof.Scene.Color) {px : Inkproof.Scene.Pixel}, ¬g.Has px → (Inkproof.Scene.render dl g bg).get? px.col px.row = Option.none
theorem Inkproof.Scene.render_spike : ∀ {dl : Inkproof.Scene.DisplayList} {bg : Inkproof.Scene.Color} {c : Inkproof.Scene.Command}, c ∈ dl → ∀ {hw : Rat} {items : List (Inkproof.Scene.Item Inkproof.Scene.Pt)}, c.shape = Inkproof.Scene.Shape.strip hw items → ∀ {a : Inkproof.Scene.Pt}, Inkproof.Scene.Item.val a ∈ items → ∀ {px : Inkproof.Scene.Pixel}, px.Contains a → ∃ c', c' ∈ dl ∧ c'.Covers px ∧ Inkproof.Scene.pixelColor dl bg px = c'.colorAt px ∧ c.layer ≤ c'.layer
def Inkproof.Scene.runsOf : List (Option Inkproof.Scene.Pt) → List (List Inkproof.Scene.Pt)
theorem Inkproof.Scene.runsOf_flatten : ∀ (l : List (Option Inkproof.Scene.Pt)), (Inkproof.Scene.runsOf l).flatten = List.filterMap id l
def Inkproof.Scene.segDiscB : Inkproof.Scene.Pt → Inkproof.Scene.Pt → Inkproof.Scene.Pt → Rat → Bool
theorem Inkproof.Scene.segDiscB_iff : ∀ (a b c : Inkproof.Scene.Pt) (r : Rat), Inkproof.Scene.segDiscB a b c r = Bool.true ↔ ∃ q, Inkproof.Scene.Region.seg a b q ∧ Inkproof.Scene.Region.disc c r q
def Inkproof.Scene.segLength : Inkproof.Scene.Pt → Inkproof.Scene.Pt → Rat
theorem Inkproof.Scene.segLength_sq_le : ∀ (a b : Inkproof.Scene.Pt), Inkproof.Scene.segLength a b * Inkproof.Scene.segLength a b ≤ (b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y)
def Inkproof.Scene.segMeetsB : Inkproof.Scene.Pt → Inkproof.Scene.Pt → Inkproof.Scene.Window → Bool
theorem Inkproof.Scene.segMeetsB_iff : ∀ (a b : Inkproof.Scene.Pt) (w : Inkproof.Scene.Window), Inkproof.Scene.segMeetsB a b w = Bool.true ↔ (Inkproof.Scene.Region.seg a b).Meets w
def Inkproof.Scene.segNearB : Inkproof.Scene.Pt → Inkproof.Scene.Pt → Rat → Inkproof.Scene.Window → Bool
theorem Inkproof.Scene.segNearB_iff : ∀ (a b : Inkproof.Scene.Pt) (r : Rat) (w : Inkproof.Scene.Window), Inkproof.Scene.segNearB a b r w = Bool.true ↔ ∃ q, Inkproof.Scene.Region.seg a b q ∧ w.Near r q
def Inkproof.Scene.segTriangles : Rat → Inkproof.Scene.Pt → Inkproof.Scene.Pt → List Inkproof.Scene.Tri
theorem Inkproof.Scene.seg_exists_y : ∀ {a b : Inkproof.Scene.Pt} {y : Rat}, Inkproof.Scene.Between a.y b.y y → ∃ q, Inkproof.Scene.Region.seg a b q ∧ q.y = y
def Inkproof.Scene.segment : Inkproof.Scene.Paint → Rat → Inkproof.Scene.Pt → Inkproof.Scene.Pt → Inkproof.Scene.Command
theorem Inkproof.Scene.segment_spec : ∀ (c : Inkproof.Scene.Paint) (w : Rat) (a b : Inkproof.Scene.Pt), (Inkproof.Scene.segment c w a b).layer = c.layer ∧ (Inkproof.Scene.segment c w a b).color = c.color ∧ (Inkproof.Scene.segment c w a b).shape = Inkproof.Scene.Shape.strip w [Inkproof.Scene.Item.val a, Inkproof.Scene.Item.val b]
def Inkproof.Scene.spanMeetsB : Rat → Rat → Rat → Rat → Rat → Rat → Inkproof.Scene.Window → Bool
theorem Inkproof.Scene.spanMeetsB_iff : ∀ (x0 x1 l0 l1 h0 h1 : Rat) (w : Inkproof.Scene.Window), Inkproof.Scene.spanMeetsB x0 x1 l0 l1 h0 h1 w = Bool.true ↔ (Inkproof.Scene.Region.span x0 x1 l0 l1 h0 h1).Meets w
theorem Inkproof.Scene.sq_le_segLength_add : ∀ (a b : Inkproof.Scene.Pt), (b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y) ≤ (Inkproof.Scene.segLength a b + 1 / 1024) * (Inkproof.Scene.segLength a b + 1 / 1024)
def Inkproof.Scene.stripTriangles : Rat → List (Inkproof.Scene.Item Inkproof.Scene.Pt) → List Inkproof.Scene.Tri
theorem Inkproof.Scene.strip_covers_triangles : ∀ {h : Rat}, 0 < h → ∀ (items : List (Inkproof.Scene.Item Inkproof.Scene.Pt)) (px : Inkproof.Scene.Pixel), (Inkproof.Scene.Shape.strip h items).region.Covers px → ∃ t, t ∈ Inkproof.Scene.stripTriangles h items ∧ t.region.Covers px
theorem Inkproof.Scene.strip_region_sub_triangles : ∀ {h : Rat}, 0 < h → ∀ (items : List (Inkproof.Scene.Item Inkproof.Scene.Pt)) (p : Inkproof.Scene.Pt), (Inkproof.Scene.Shape.strip h items).region p → ∃ t, t ∈ Inkproof.Scene.stripTriangles h items ∧ t.region p
theorem Inkproof.Scene.thicken_seg_sub_segTriangles : ∀ {h : Rat}, 0 < h → ∀ (a b p : Inkproof.Scene.Pt), Inkproof.Scene.Region.thicken h (Inkproof.Scene.Region.seg a b) p → ∃ t, t ∈ Inkproof.Scene.segTriangles h a b ∧ t.region p
def Inkproof.Scene.winner : (Inkproof.Scene.Command → Bool) → List Inkproof.Scene.Command → Option Inkproof.Scene.Command
def Inkproof.Scene.winnerStep : (Inkproof.Scene.Command → Bool) → Option Inkproof.Scene.Command → Inkproof.Scene.Command → Option Inkproof.Scene.Command
theorem Inkproof.Scene.winner_spec : ∀ (cov : Inkproof.Scene.Command → Bool) (cmds : List Inkproof.Scene.Command), (Inkproof.Scene.winner cov cmds = Option.none ↔ ∀ (c : Inkproof.Scene.Command), c ∈ cmds → cov c = Bool.false) ∧ ∀ (c : Inkproof.Scene.Command), Inkproof.Scene.winner cov cmds = Option.some c → ∃ l1 l2, cmds = l1 ++ c :: l2 ∧ cov c = Bool.true ∧ (∀ (c' : Inkproof.Scene.Command), c' ∈ l1 → cov c' = Bool.true → c'.layer ≤ c.layer) ∧ ∀ (c' : Inkproof.Scene.Command), c' ∈ l2 → cov c' = Bool.true → c'.layer < c.layer
def Inkproof.Scene.xKey : Rat → Int
theorem Inkproof.Scene.xKey_cases : ∀ (x : Rat), x = ↑x.floor ∧ Inkproof.Scene.xKey x = 2 * x.floor ∨ ↑x.floor < x ∧ x < ↑x.floor + 1 ∧ Inkproof.Scene.xKey x = 2 * x.floor + 1
theorem Inkproof.Scene.xKey_col : ∀ {x y : Rat} (c : Nat), Inkproof.Scene.xKey x = Inkproof.Scene.xKey y → ↑c ≤ x ∧ x ≤ ↑c + 1 → ↑c ≤ y ∧ y ≤ ↑c + 1
theorem Inkproof.Scene.xKey_mono : ∀ {x y : Rat}, x ≤ y → Inkproof.Scene.xKey x ≤ Inkproof.Scene.xKey y
