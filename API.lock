def Inkproof.Scene.lengthBound : Inkproof.Scene.Pt → Rat
theorem Inkproof.Scene.lengthBound_pos : ∀ (f : Inkproof.Scene.Pt), 0 < f.x * f.x + f.y * f.y → 0 < Inkproof.Scene.lengthBound f
theorem Inkproof.Scene.lengthBound_sq_le : ∀ (f : Inkproof.Scene.Pt), Inkproof.Scene.lengthBound f * Inkproof.Scene.lengthBound f ≤ f.x * f.x + f.y * f.y
theorem Inkproof.Scene.list_rev_induction : ∀ {α : Type} {P : List α → Prop}, P [] → (∀ (l : List α) (x : α), P l → P (l ++ [x])) → ∀ (l : List α), P l
theorem Inkproof.Scene.mul_le_mul_right_iff : ∀ {x y d : Rat}, 0 < d → (x * d ≤ y * d ↔ x ≤ y)
theorem Inkproof.Scene.mul_self_nonneg' : ∀ (r : Rat), 0 ≤ r * r
theorem Inkproof.Scene.parallelogram_sub_tris : ∀ (a e f : Inkproof.Scene.Pt) (u v : Rat), 0 ≤ u → u ≤ 1 → 0 ≤ v → v ≤ 1 → have p := { x := a.x + u * e.x + v * f.x, y := a.y + u * e.y + v * f.y }; { a := a, b := { x := a.x + e.x, y := a.y + e.y }, c := { x := a.x + f.x, y := a.y + f.y } }.region p ∨ { a := { x := a.x + e.x + f.x, y := a.y + e.y + f.y }, b := { x := a.x + f.x, y := a.y + f.y }, c := { x := a.x + e.x, y := a.y + e.y } }.region p
def Inkproof.Scene.pixelColor : Inkproof.Scene.DisplayList → Inkproof.Scene.Color → Inkproof.Scene.Pixel → Inkproof.Scene.Color
theorem Inkproof.Scene.pixelColor_covered : ∀ {dl : Inkproof.Scene.DisplayList} {bg : Inkproof.Scene.Color} {px : Inkproof.Scene.Pixel} {c : Inkproof.Scene.Command}, c ∈ dl → c.Covers px → ∃ c', c' ∈ dl ∧ c'.Covers px ∧ Inkproof.Scene.pixelColor dl bg px = c'.color ∧ c.layer ≤ c'.layer
theorem Inkproof.Scene.pixelColor_of_covers : ∀ {dl : Inkproof.Scene.DisplayList} {bg : Inkproof.Scene.Color} {px : Inkproof.Scene.Pixel}, dl.Covers px → ∃ l1 c l2, dl.toList = l1 ++ c :: l2 ∧ c.Covers px ∧ Inkproof.Scene.pixelColor dl bg px = c.color ∧ (∀ (c' : Inkproof.Scene.Command), c' ∈ l1 → c'.Covers px → c'.layer ≤ c.layer) ∧ ∀ (c' : Inkproof.Scene.Command), c' ∈ l2 → c'.Covers px → c'.layer < c.layer
theorem Inkproof.Scene.pixelColor_of_not_covers : ∀ {dl : Inkproof.Scene.DisplayList} {bg : Inkproof.Scene.Color} {px : Inkproof.Scene.Pixel}, ¬dl.Covers px → Inkproof.Scene.pixelColor dl bg px = bg
theorem Inkproof.Scene.quad_min : ∀ {D k E t0 t : Rat}, 0 < D → t0 * D = -k → 0 ≤ t → t ≤ 1 → D * Inkproof.Scene.clamp t0 0 1 * Inkproof.Scene.clamp t0 0 1 + 2 * Inkproof.Scene.clamp t0 0 1 * k + E ≤ D * t * t + 2 * t * k + E
def Inkproof.Scene.render : Inkproof.Scene.DisplayList → Inkproof.Scene.Grid → Inkproof.Scene.Color → Inkproof.Scene.Image
theorem Inkproof.Scene.render_get? : ∀ (dl : Inkproof.Scene.DisplayList) (g : Inkproof.Scene.Grid) (bg : Inkproof.Scene.Color) {px : Inkproof.Scene.Pixel}, g.Has px → (Inkproof.Scene.render dl g bg).get? px.col px.row = Option.some (Inkproof.Scene.pixelColor dl bg px)
theorem Inkproof.Scene.render_get?_out : ∀ (dl : Inkproof.Scene.DisplayList) (g : Inkproof.Scene.Grid) (bg : Inkproof.Scene.Color) {px : Inkproof.Scene.Pixel}, ¬g.Has px → (Inkproof.Scene.render dl g bg).get? px.col px.row = Option.none
theorem Inkproof.Scene.render_spike : ∀ {dl : Inkproof.Scene.DisplayList} {bg : Inkproof.Scene.Color} {c : Inkproof.Scene.Command}, c ∈ dl → ∀ {hw : Rat} {items : List (Inkproof.Scene.Item Inkproof.Scene.Pt)}, c.shape = Inkproof.Scene.Shape.strip hw items → ∀ {a : Inkproof.Scene.Pt}, Inkproof.Scene.Item.val a ∈ items → ∀ {px : Inkproof.Scene.Pixel}, px.Contains a → ∃ c', c' ∈ dl ∧ c'.Covers px ∧ Inkproof.Scene.pixelColor dl bg px = c'.color ∧ c.layer ≤ c'.layer
def Inkproof.Scene.segDiscB : Inkproof.Scene.Pt → Inkproof.Scene.Pt → Inkproof.Scene.Pt → Rat → Bool
theorem Inkproof.Scene.segDiscB_iff : ∀ (a b c : Inkproof.Scene.Pt) (r : Rat), Inkproof.Scene.segDiscB a b c r = Bool.true ↔ ∃ q, Inkproof.Scene.Region.seg a b q ∧ Inkproof.Scene.Region.disc c r q
def Inkproof.Scene.segMeetsB : Inkproof.Scene.Pt → Inkproof.Scene.Pt → Inkproof.Scene.Window → Bool
theorem Inkproof.Scene.segMeetsB_iff : ∀ (a b : Inkproof.Scene.Pt) (w : Inkproof.Scene.Window), Inkproof.Scene.segMeetsB a b w = Bool.true ↔ (Inkproof.Scene.Region.seg a b).Meets w
def Inkproof.Scene.segNearB : Inkproof.Scene.Pt → Inkproof.Scene.Pt → Rat → Inkproof.Scene.Window → Bool
theorem Inkproof.Scene.segNearB_iff : ∀ (a b : Inkproof.Scene.Pt) (r : Rat) (w : Inkproof.Scene.Window), Inkproof.Scene.segNearB a b r w = Bool.true ↔ ∃ q, Inkproof.Scene.Region.seg a b q ∧ w.Near r q
def Inkproof.Scene.segTriangles : Rat → Inkproof.Scene.Pt → Inkproof.Scene.Pt → List Inkproof.Scene.Tri
def Inkproof.Scene.spanMeetsB : Rat → Rat → Rat → Rat → Rat → Rat → Inkproof.Scene.Window → Bool
theorem Inkproof.Scene.spanMeetsB_iff : ∀ (x0 x1 l0 l1 h0 h1 : Rat) (w : Inkproof.Scene.Window), Inkproof.Scene.spanMeetsB x0 x1 l0 l1 h0 h1 w = Bool.true ↔ (Inkproof.Scene.Region.span x0 x1 l0 l1 h0 h1).Meets w
theorem Inkproof.Scene.sq_le_sq_neg : ∀ {a b : Rat}, a ≤ 0 → b ≤ a → a * a ≤ b * b
theorem Inkproof.Scene.sq_le_sq_pos : ∀ {a b : Rat}, 0 ≤ a → a ≤ b → a * a ≤ b * b
def Inkproof.Scene.stripTriangles : Rat → List (Inkproof.Scene.Item Inkproof.Scene.Pt) → List Inkproof.Scene.Tri
theorem Inkproof.Scene.strip_covers_triangles : ∀ {h : Rat}, 0 < h → ∀ (items : List (Inkproof.Scene.Item Inkproof.Scene.Pt)) (px : Inkproof.Scene.Pixel), (Inkproof.Scene.Shape.strip h items).region.Covers px → ∃ t, t ∈ Inkproof.Scene.stripTriangles h items ∧ t.region.Covers px
theorem Inkproof.Scene.strip_region_sub_triangles : ∀ {h : Rat}, 0 < h → ∀ (items : List (Inkproof.Scene.Item Inkproof.Scene.Pt)) (p : Inkproof.Scene.Pt), (Inkproof.Scene.Shape.strip h items).region p → ∃ t, t ∈ Inkproof.Scene.stripTriangles h items ∧ t.region p
theorem Inkproof.Scene.thicken_seg_sub_segTriangles : ∀ {h : Rat}, 0 < h → ∀ (a b p : Inkproof.Scene.Pt), Inkproof.Scene.Region.thicken h (Inkproof.Scene.Region.seg a b) p → ∃ t, t ∈ Inkproof.Scene.segTriangles h a b ∧ t.region p
def Inkproof.Scene.winner : (Inkproof.Scene.Command → Bool) → List Inkproof.Scene.Command → Option Inkproof.Scene.Command
def Inkproof.Scene.winnerStep : (Inkproof.Scene.Command → Bool) → Option Inkproof.Scene.Command → Inkproof.Scene.Command → Option Inkproof.Scene.Command
theorem Inkproof.Scene.winner_spec : ∀ (cov : Inkproof.Scene.Command → Bool) (cmds : List Inkproof.Scene.Command), (Inkproof.Scene.winner cov cmds = Option.none ↔ ∀ (c : Inkproof.Scene.Command), c ∈ cmds → cov c = Bool.false) ∧ ∀ (c : Inkproof.Scene.Command), Inkproof.Scene.winner cov cmds = Option.some c → ∃ l1 l2, cmds = l1 ++ c :: l2 ∧ cov c = Bool.true ∧ (∀ (c' : Inkproof.Scene.Command), c' ∈ l1 → cov c' = Bool.true → c'.layer ≤ c.layer) ∧ ∀ (c' : Inkproof.Scene.Command), c' ∈ l2 → cov c' = Bool.true → c'.layer < c.layer
