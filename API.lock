theorem Inkproof.Scene.evalStops_after : ∀ (s : Inkproof.Scene.Stop) (rest : List Inkproof.Scene.Stop), List.Pairwise (fun x1 x2 => x1.pos < x2.pos) (s :: rest) → ∀ {t : Rat}, (∀ (n : Inkproof.Scene.Stop), n ∈ s :: rest → n.pos ≤ t) → Inkproof.Scene.evalStops s rest t = ((s :: rest).getLast ⋯).color
