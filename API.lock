theorem Inkproof.Scene.evalStops_before : ∀ (s : Inkproof.Scene.Stop) (rest : List Inkproof.Scene.Stop) {t : Rat}, t ≤ s.pos → Inkproof.Scene.evalStops s rest t = s.color
theorem Inkproof.Scene.evalStops_between : ∀ (s n : Inkproof.Scene.Stop) (rest : List Inkproof.Scene.Stop) {t : Rat}, s.pos < t → t ≤ n.pos → Inkproof.Scene.evalStops s (n :: rest) t = s.color.lerp n.color ((t - s.pos) / (n.pos - s.pos))
theorem Inkproof.Scene.exists_between : ∀ (l h y0 y1 : Rat), (∃ y, Inkproof.Scene.Between l h y ∧ y0 ≤ y ∧ y ≤ y1) ↔ y0 ≤ y1 ∧ (l ≤ y1 ∨ h ≤ y1) ∧ (y0 ≤ l ∨ y0 ≤ h)
